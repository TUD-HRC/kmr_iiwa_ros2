#These are the ip of the tcp/udp servers,
#So the pc running these ros2 nodes.
kmp_statusdata_node:
  ros__parameters:

    port: 30001
    KMR1/ip: '172.31.1.149'
    KMR2/ip: '172.31.1.149'

kmp_commands_node:
  ros__parameters:

    port: 30002
    KMR1/ip: '172.31.1.149'
    KMR2/ip: '172.31.1.149'

kmp_laserscan_node:
  ros__parameters:
    robot_name: 'kmr_iiwa'
    port: 30003
    ip: '172.31.1.149'

kmp_odometry_node:
  ros__parameters:
    robot_name: 'kmr_iiwa'
    port: 3000
    ip: '172.31.1.149'
    connection_type: 'TCP'
    init_odom: True
    period_sec: 0.01

lbr_commands_node:
  ros__parameters:
    robot_name: 'kmr_iiwa'
    port: 30005
    KMR1/ip: '172.31.1.149'
    KMR2/ip: '172.31.1.149'
    # MoveIt Servo output (std_msgs/Float64MultiArray, joint order A1..A7).
    servo_cmd_topic: 'servo_joint_cmd'
    # Fixed-rate servo stream. Lower this if the Sunrise app falls behind.
    command_rate: 100.0
    # Stop streaming and send CancelMotion if no new target arrives in time.
    command_timeout: 0.3

lbr_statusdata_node:
  ros__parameters:

    port: 30006
    KMR1/ip: '172.31.1.149'
    KMR2/ip: '172.31.1.149'

lbr_sensordata_node:
  ros__parameters:
    robot_name: 'kmr_iiwa'
    port: 30007
    ip: '172.31.1.149'
    connection_type: 'TCP'
