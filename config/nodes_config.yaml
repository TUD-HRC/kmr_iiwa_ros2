# These are the ip of the UDP/UDP servers,
# So the pc running these ros2 nodes.
#
# ``enabled`` mirrors the ENABLE_* switches in the Java Config.java.
# Disable a stream on both sides together; a disabled node still starts
# but does not open a socket or wait for the robot to connect.
/**/kmp_statusdata_node:
  ros__parameters:
    enabled: false
    robot_name: 'kmr_iiwa'
    port: 30001
    ip: '172.31.1.149'
    connection_type: 'UDP'

/**/kmp_commands_node:
  ros__parameters:
    enabled: true
    robot_name: 'kmr_iiwa'
    port: 30002
    ip: '172.31.1.149'
    connection_type: 'UDP'

/**/kmp_laserscan_node:
  ros__parameters:
    enabled: true
    robot_name: 'kmr_iiwa'
    port: 30003
    ip: '172.31.1.149'
    connection_type: 'UDP'
    # Per-laser publishing, matching ENABLE_KMP_SCAN_FRONT_RIGHT/BACK_LEFT.
    enable_scan_front_right: true
    enable_scan_back_left: true

/**/kmp_odometry_node:
  ros__parameters:
    enabled: true
    robot_name: 'kmr_iiwa'
    port: 30004
    ip: '172.31.1.149'
    connection_type: 'UDP'
    init_odom: True
    period_sec: 0.01

/**/lbr_commands_node:
  ros__parameters:
    enabled: true
    robot_name: 'kmr_iiwa'
    port: 30005
    ip: '172.31.1.149'
    connection_type: 'UDP'
    # MoveIt Servo output (std_msgs/Float64MultiArray, joint order A1..A7).
    servo_cmd_topic: 'servo_joint_cmd'

/**/lbr_statusdata_node:
  ros__parameters:
    enabled: false
    robot_name: 'kmr_iiwa'
    port: 30006
    ip: '172.31.1.149'
    connection_type: 'UDP'

/**/lbr_sensordata_node:
  ros__parameters:
    enabled: true
    robot_name: 'kmr_iiwa'
    port: 30007
    ip: '172.31.1.149'
    connection_type: 'UDP'
